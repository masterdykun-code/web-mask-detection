services:
  - type: web
    name: render-yolo-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: YOLO_MODEL_BUCKET
        value: yolo-models
      - key: YOLO_MODEL_OBJECT
        value: best.onnx
      - key: YOLO_CONF
        value: "0.40"
      - key: YOLO_IMGSZ
        value: "320"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: ORT_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TELEGRAM_COOLDOWN_SECONDS
        value: "20"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        value: https://aiumzxboxbbphafebaig.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: detection-images
      - key: SUPABASE_TABLE
        value: detection_events
      - key: MAX_FRAME_BYTES
        value: "2097152"
      - key: IOT_DEVICE_TOKEN
        sync: false
      - key: IOT_VIEW_TOKEN
        sync: false
