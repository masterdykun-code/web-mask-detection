<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d18" />
    <title>Nhận diện khẩu trang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Mask<span class="brand-accent">Vision</span></span></div>
        <div class="status" id="state" role="status" title="Trạng thái model"><span class="status-dot"></span><span>Đang kết nối</span></div>
      </header>
      <main class="layout">
        <section class="card">
          <div class="section-head">
            <div><p class="eyebrow">CAMERA</p><h1>Nhận diện trực tiếp</h1></div>
            <span class="live-pill" id="liveStatus">Đang tắt</span>
          </div>
          <div class="video-box" id="videoBox">
            <div class="video-stage" id="videoStage">
              <video id="video" autoplay playsinline muted></video>
              <img id="iotFrame" alt="Khung hình từ ESP32-CAM" hidden />
              <canvas id="overlay" aria-hidden="true"></canvas>
            </div>
            <div class="placeholder" id="placeholder">
              <div class="placeholder-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7.5h3l1.5-2h7l1.5 2h3A1.5 1.5 0 0 1 21.5 9v9a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/><circle cx="12" cy="13" r="3.5"/></svg>
              </div>
              Bật camera để bắt đầu
            </div>
          </div>
          <div class="controls">
            <select id="sourceSelect" aria-label="Chọn nguồn camera">
              <option value="laptop">Camera laptop</option>
              <option value="iot">Camera IoT · ESP32-CAM</option>
            </select>
            <button class="primary" id="startBtn"><span class="btn-icon">▶</span>Bật camera</button>
            <button id="stopBtn" disabled>Dừng</button>
            <select id="cameraSelect" aria-label="Chọn camera"><option value="">Camera mặc định</option></select>
            <button id="switchBtn">Đổi camera</button>
            <div class="iot-access" id="iotAccess" hidden>
              <input id="iotViewToken" type="password" autocomplete="off" placeholder="Mã xem camera IoT" aria-label="Mã xem camera IoT" />
              <button id="saveIotToken" type="button">Lưu mã</button>
            </div>
          </div>
        </section>
        <aside class="card">
          <div class="section-head">
            <h2>Phát hiện</h2>
            <span class="count-pill"><strong id="count">0</strong> đối tượng</span>
          </div>
          <div class="metrics">
            <div class="metric" title="Thời gian tiền xử lý, chạy ONNX và hậu xử lý trên Render">
              <span class="metric-label">Suy luận cloud</span>
              <strong><span id="infer">—</span><small>ms</small></strong>
              <span class="metric-average" id="inferAvg">TB —</span>
            </div>
            <div class="metric" title="Từ lúc gửi ảnh đến khi nhận và phân tích xong phản hồi JSON">
              <span class="metric-label" id="rttLabel">Local ↔ Cloud</span>
              <strong><span id="rtt">—</span><small>ms</small></strong>
              <span class="metric-average" id="rttAvg">TB —</span>
            </div>
            <div class="metric" title="Từ lúc chụp frame trên trình duyệt đến khi vẽ bbox">
              <span class="metric-label" id="e2eLabel">Chụp frame → bbox</span>
              <strong><span id="e2e">—</span><small>ms</small></strong>
              <span class="metric-average" id="e2eAvg">TB —</span>
            </div>
          </div>
          <div class="detected-head"><h3>Đối tượng</h3><span class="result-summary" id="resultSummary">—</span></div>
          <div id="detections" class="detections"><div class="empty">Chưa phát hiện đối tượng</div></div>
          <div id="action" class="notice" aria-live="polite" hidden><p></p></div>
        </aside>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </body>
</html>
